<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PaperVault</title>
    <script>
      // spa-github-pages pattern: GitHub Pages serves this file for unknown
      // paths. Capture the requested path and bounce to /?/path so the SPA
      // router can restore it. pathSegmentsToKeep=1 keeps "/papervault".
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
