<!DOCTYPE html>
<html>
<head><title>Seed PaperVault Subjects</title></head>
<body>
<h1>Seeding subjects...</h1>
<div id="log"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyALYbrMfJnIudaBuqIGGkrN5oGhbKtj9_Q",
  authDomain: "papervault-a2179.firebaseapp.com",
  projectId: "papervault-a2179",
  storageBucket: "papervault-a2179.firebasestorage.app",
  messagingSenderId: "949347290161",
  appId: "1:949347290161:web:8404160dcbb9239f6a9910"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const log = (m) => document.getElementById("log").innerHTML += m + "<br>";

const subjects = [
  { name: "Data Structures and Algorithms", code: "CSE2001", codes: ["CSE2001", "CSE2002"], program: "B.Tech CSE", semester: 3, active: true },
  { name: "Artificial Intelligence", code: "CSE3002", codes: ["CSE3002"], program: "B.Tech CSE", semester: 5, active: true },
  { name: "Computer Organization and Architecture", code: "CSE2003", codes: ["CSE2003"], program: "B.Tech CSE", semester: 3, active: true },
  { name: "Discrete Mathematical Structures", code: "BIT1001", codes: ["BIT1001"], program: "B.Tech CSE", semester: 2, active: true },
  { name: "Operating Systems", code: "CSE2005", codes: ["CSE2005"], program: "B.Tech CSE", semester: 4, active: true },
  { name: "Database Management Systems", code: "CSE2004", codes: ["CSE2004"], program: "B.Tech CSE", semester: 4, active: true },
  { name: "Computer Networks", code: "CSE3001", codes: ["CSE3001"], program: "B.Tech CSE", semester: 5, active: true },
  { name: "Engineering Mathematics", code: "MAT1001", codes: ["MAT1001"], program: "B.Tech CSE", semester: 1, active: true },
  { name: "Engineering Chemistry", code: "CHY1001", codes: ["CHY1001"], program: "B.Tech CSE", semester: 1, active: true },
  { name: "Engineering Physics", code: "PHY1001", codes: ["PHY1001"], program: "B.Tech CSE", semester: 1, active: true },
  { name: "Web Development", code: "CSE2010", codes: ["CSE2010"], program: "B.Tech CSE", semester: 4, active: true },
  { name: "Digital Electronics", code: "ECE2001", codes: ["ECE2001"], program: "B.Tech CSE", semester: 3, active: true },
];

try {
  for (const s of subjects) {
    await addDoc(collection(db, "subjects"), { ...s, createdAt: new Date().toISOString(), paperCount: 0 });
    log("Added: " + s.name);
  }
  log("<b>DONE — 12 subjects seeded!</b>");
} catch (e) {
  log("<b>ERROR: " + e.message + "</b>");
}
</script>
</body>
</html>
