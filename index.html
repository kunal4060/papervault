<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // spa-github-pages: restore "/?/papers/CSE2001" → "/papers/CSE2001"
      // before React mounts. https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0D10" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="PaperVault — VIT-AP previous year question papers (CAT-1, CAT-2, FAT), syllabus and verified notes. 5,300+ papers across 260+ subjects. Free for every VIT-AP student." />
    <meta name="keywords" content="VIT-AP question papers, VIT AP previous year papers, CAT-1 papers, CAT-2 papers, FAT papers, VIT-AP syllabus, VIT-AP notes, PaperVault" />
    <meta name="author" content="PaperVault" />
    <link rel="canonical" href="https://kunal4060.github.io/papervault/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperVault" />
    <meta property="og:title" content="PaperVault — VIT-AP Papers & Notes" />
    <meta property="og:description" content="VIT-AP previous year papers (CAT-1, CAT-2, FAT), syllabus and verified notes. 5,300+ papers across 260+ subjects — free for every student." />
    <meta property="og:url" content="https://kunal4060.github.io/papervault/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PaperVault — VIT-AP Papers & Notes" />
    <meta name="twitter:description" content="VIT-AP previous year papers (CAT-1, CAT-2, FAT), syllabus and verified notes. Free for every student." />

    <!-- Structured data: WebSite (helps Google + AI answer engines understand the site) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PaperVault",
      "alternateName": "VIT-AP Paper Vault",
      "url": "https://kunal4060.github.io/papervault/",
      "description": "VIT-AP previous year question papers (CAT-1, CAT-2, FAT), syllabus and verified notes. Free for every VIT-AP student.",
      "inLanguage": "en",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://kunal4060.github.io/papervault/#/papers?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>PaperVault — VIT-AP Papers & Notes</title>
  </head>

</html>
